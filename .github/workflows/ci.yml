name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # Node 22 is the oldest line the DSH 0.2.x host runs on; 24 is what the
      # desktop app ships with. Both must pass — the plugin has no build step,
      # so a syntax or runtime difference here is a shipped defect.
      matrix:
        node-version:
          - 22
          - 24

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Syntax-check every entry point
        run: |
          for file in lib/*.js; do
            node --check "$file"
          done

      - name: Run the test suite
        run: npm test
